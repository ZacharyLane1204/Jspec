[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jspec"
version = "0.1.0"
description = "JWST NIRSpec + MIRI spectral stitching, feature identification and profile fitting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "astropy>=5.0",
    "matplotlib>=3.5",
    "pandas>=1.4",
]

[project.optional-dependencies]
# Nested sampling for `jspec fit`. Not pulled in by default because it is
# only needed once you get to profile fitting, and it is the one dependency
# missing from a stock jwst conda environment.
fit = ["dynesty>=2.0"]
# Better collisionally-excited-line emissivities for `jspec.metallicity`.
# Without it the module falls back to built-in values and says so.
metallicity = ["pyneb>=1.1"]
# The Stage 1-3 reduction scripts in jspec/pipelines. Heavy; install only
# if you are reducing data rather than analysing an existing spectrum.
pipelines = ["jwst>=1.12", "crds", "astroquery", "AstroBkgInterp", "sep"]
all = ["dynesty>=2.0", "pyneb>=1.1", "jwst>=1.12", "crds", "astroquery",
       "AstroBkgInterp", "sep"]

[project.scripts]
jspec = "jspec.cli:main"

# This repository is laid out "flat": the repository root *is* the `jspec`
# package, rather than containing a `jspec/` subdirectory. The mapping below
# is what makes `import jspec` work after `pip install -e .` no matter what
# you named the directory you cloned into.
[tool.setuptools]
packages = ["jspec", "jspec.pipelines"]

[tool.setuptools.package-dir]
jspec = "."
"jspec.pipelines" = "pipelines"

[tool.setuptools.package-data]
jspec = ["data/*.csv"]
